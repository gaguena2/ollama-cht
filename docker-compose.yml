services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks:
      - ollama-cht

  db:
    image: postgres:16-alpine
    container_name: ollama-cht-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ollama_cht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollama_cht}
      POSTGRES_DB: ${POSTGRES_DB:-ollama_cht}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollama_cht}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ollama-cht

  app:
    build: .
    container_name: ollama-cht-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - ollama-cht

volumes:
  ollama:
    external: true
  postgres_data:

networks:
  ollama-cht:
    driver: bridge
